name: Publish tested Windows preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Windows build run ID
        required: true
        type: string
      tag:
        description: New preview tag (for example v0.1.3-preview)
        required: true
        type: string
      title:
        description: Release title
        required: true
        type: string
      notes_file:
        description: Version notes path (.github/release-notes/<tag>.md)
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-windows-preview
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify inputs and successful build provenance
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUN_ID -notmatch '^[0-9]+$') { throw 'Invalid run ID' }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-preview(?:\.[0-9]+)?$') { throw 'Expected a versioned preview tag' }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TITLE) -or $env:RELEASE_TITLE -match '[\r\n]') { throw 'Invalid release title' }
          if ($env:NOTES_FILE -cne ".github/release-notes/$env:RELEASE_TAG.md") { throw 'Notes path must match the release tag' }
          if (!(Test-Path -LiteralPath $env:NOTES_FILE -PathType Leaf)) { throw 'Missing version notes' }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $env:NOTES_FILE -Raw))) { throw 'Empty version notes' }
          $tags = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing tags' }
          if ($tags) { throw 'Refusing to reuse an existing tag' }
          $releases = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases' }
          if ($releases -contains $env:RELEASE_TAG) { throw 'Refusing to overwrite an existing release' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect build run' }
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/windows.yml' -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $run.head_branch -ne 'main' -or $run.event -notin @('push', 'workflow_dispatch')) { throw 'Expected successful main-branch Windows build' }
          if ($run.head_sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA' }
          git merge-base --is-ancestor $run.head_sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Build source must belong to this main history' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUN_ID/artifacts?name=PixelTransfer-win-x64" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect build artifact' }
          $matches = @($artifacts.artifacts | Where-Object { $_.name -eq 'PixelTransfer-win-x64' -and !$_.expired -and $_.size_in_bytes -gt 0 -and $_.workflow_run.head_sha -eq $run.head_sha })
          if ($matches.Count -ne 1) { throw 'Expected exactly one unexpired Windows artifact for the tested SHA' }
          "sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          "artifact_id=$($matches[0].id)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/PixelTransfer-win-x64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Package, publish and verify preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Assert-WindowsPackage.ps1 -PackagePath artifacts/PixelTransfer-win-x64 -SourceCommit $env:SOURCE_SHA
          Compress-Archive -Path artifacts/PixelTransfer-win-x64/* -DestinationPath PixelTransfer-win-x64.zip
          ./scripts/Assert-WindowsPackage.ps1 -PackagePath artifacts/PixelTransfer-win-x64 -SourceCommit $env:SOURCE_SHA -ZipPath PixelTransfer-win-x64.zip
          $hash = (Get-FileHash PixelTransfer-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PixelTransfer-win-x64.zip" | Set-Content PixelTransfer-win-x64.zip.sha256 -Encoding utf8NoBOM
          $notes = Get-Content -LiteralPath $env:NOTES_FILE -Raw
          $notes += "`n`n## Build provenance`n- Source commit: $env:SOURCE_SHA`n- Successful Windows CI: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:RUN_ID`n- ZIP SHA-256: $hash`n"
          $notes | Set-Content release-notes.md -Encoding utf8NoBOM
          # Atomic tag creation fails if another publisher created the tag after preflight.
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create a new tag; refusing to reuse or overwrite one' }
          gh release create $env:RELEASE_TAG PixelTransfer-win-x64.zip PixelTransfer-win-x64.zip.sha256 --verify-tag --prerelease --target $env:SOURCE_SHA --title $env:RELEASE_TITLE --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed; inspect state before retrying' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify published release' }
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify published tag' }
          if ($ref.object.type -ne 'commit' -or $ref.object.sha -ne $env:SOURCE_SHA -or $release.target_commitish -ne $env:SOURCE_SHA -or $release.draft -or !$release.prerelease) { throw 'Published release provenance mismatch' }
          $assets = @($release.assets | Where-Object { $_.name -eq 'PixelTransfer-win-x64.zip' -and $_.state -eq 'uploaded' })
          if ($assets.Count -ne 1 -or $assets[0].size -ne (Get-Item PixelTransfer-win-x64.zip).Length) { throw 'Published ZIP mismatch' }
          gh release download $env:RELEASE_TAG --pattern PixelTransfer-win-x64.zip --dir verified-download
          if ($LASTEXITCODE -ne 0) { throw 'Could not download published ZIP' }
          if ((Get-FileHash verified-download/PixelTransfer-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Downloaded ZIP checksum mismatch' }
          "Release: $($release.html_url)`nSource: $env:SOURCE_SHA`nDownload: $($assets[0].browser_download_url)`nSHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
