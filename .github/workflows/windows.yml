name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stamp diagnostic build provenance
        shell: pwsh
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "<Project><PropertyGroup><InformationalVersion>rdp-diagnostics+$env:TESTED_HEAD</InformationalVersion></PropertyGroup></Project>" | Set-Content Directory.Build.targets
      - name: Test C# transport core
        run: dotnet run --project tests/PixelTransfer.Tests -c Release
      - name: Verify repeatable synthetic RDP fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          ./scripts/New-RdpTestInput.ps1 -OutputPath artifacts/fixture.bin -SizeMiB 1 | Out-Null
          if ((Get-Item artifacts/fixture.bin).Length -ne 1048576) { throw 'Wrong fixture size' }
          if ((Get-FileHash artifacts/fixture.bin).Hash -ne '414CE6A756CB3274D0D33164315E89350D9963FF4B003AE9DB3CD2D3547D6DA5') { throw 'Fixture bytes changed' }
          $rejected = $false
          try { ./scripts/New-RdpTestInput.ps1 -OutputPath artifacts/fixture.bin -SizeMiB 1 | Out-Null } catch { $rejected = $true }
          if (-not $rejected) { throw 'Fixture generator overwrote existing data' }
          Remove-Item artifacts/fixture.bin
      - name: Measure synthetic search stress
        run: dotnet run --project tests/PixelTransfer.Stress -c Release -- 20 artifacts/search-current.json
      - name: Check out 0.1.2 baseline for identical stress harness
        uses: actions/checkout@v4
        with:
          ref: 44419172ad16b5f212442f34d1fcd909efd44901
          path: .baseline
      - name: Measure baseline with the same scenes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .baseline/tests/PixelTransfer.Stress | Out-Null
          Copy-Item tests/PixelTransfer.Stress/*.cs .baseline/tests/PixelTransfer.Stress
          Copy-Item tests/PixelTransfer.Stress/*.csproj .baseline/tests/PixelTransfer.Stress
          dotnet run --project .baseline/tests/PixelTransfer.Stress -c Release -- 20 artifacts/search-baseline.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Interleave baseline and current core in one process
        run: dotnet run --project tests/PixelTransfer.Stress -c Release -- --compare-core .baseline/src/PixelTransfer.Core/bin/Release/net10.0/PixelTransfer.Core.dll 30 artifacts/search-paired.json
      - name: Summarize search measurements
        shell: pwsh
        run: |
          $before = Get-Content artifacts/search-baseline.json -Raw | ConvertFrom-Json
          $after = Get-Content artifacts/search-current.json -Raw | ConvertFrom-Json
          "| Scene | Baseline p50 ms | Current p50 ms | Baseline p95 ms | Current p95 ms | Baseline bytes/call | Current bytes/call |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---:|---:|---:|---:|---:|---:|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($row in $after.results) {
            $old = $before.results | Where-Object name -eq $row.name
            "| $($row.name) | $([math]::Round($old.p50_ms, 3)) | $([math]::Round($row.p50_ms, 3)) | $([math]::Round($old.p95_ms, 3)) | $([math]::Round($row.p95_ms, 3)) | $($old.allocated_bytes_per_call) | $($row.allocated_bytes_per_call) |" >> $env:GITHUB_STEP_SUMMARY
          }
          $paired = Get-Content artifacts/search-paired.json -Raw | ConvertFrom-Json
          "" >> $env:GITHUB_STEP_SUMMARY
          "### Paired controls (same process, alternating order)" >> $env:GITHUB_STEP_SUMMARY
          "| Scene | Baseline p50 ms | Current p50 ms | Baseline p95 ms | Current p95 ms |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---:|---:|---:|---:|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($row in $paired.results) {
            "| $($row.name) | $([math]::Round($row.baseline_p50_ms, 3)) | $([math]::Round($row.current_p50_ms, 3)) | $([math]::Round($row.baseline_p95_ms, 3)) | $([math]::Round($row.current_p95_ms, 3)) |" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/PixelTransfer.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/PixelTransfer-win-x64
      - name: Test WPF display and native screen capture
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './artifacts/PixelTransfer-win-x64/PixelTransfer.exe' -ArgumentList '--self-test', 'windows-smoke.txt' -Wait -PassThru
          if (Test-Path windows-smoke.txt) { Get-Content windows-smoke.txt }
          if ($process.ExitCode -ne 0) { throw "Windows smoke test failed: $($process.ExitCode)" }
      - name: Include user instructions
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/PixelTransfer-win-x64/README.md
          Copy-Item docs/RDP-VALIDATION.md artifacts/PixelTransfer-win-x64/RDP-VALIDATION.md
          Copy-Item scripts/New-RdpTestInput.ps1 artifacts/PixelTransfer-win-x64/New-RdpTestInput.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PixelTransfer-win-x64
          path: artifacts/PixelTransfer-win-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: |
            windows-smoke.txt
            artifacts/search-*.json
            artifacts/diagnostics-*.json
